<!DOCTYPE html>
<html lang="es">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Calculadora BARFITOS</title>

<style>
body {
  margin: 0;
  font-family: Arial, sans-serif;
  background: #f5f5f5;
}

.container {
  max-width: 420px;
  margin: auto;
  padding: 20px;
}

.logo {
  width: 220px;
  display: block;
  margin: 10px auto 15px;
}

.card {
  background: white;
  padding: 20px;
  border-radius: 16px;
  box-shadow: 0 8px 25px rgba(0,0,0,0.08);
}

input, select {
  width: 100%;
  padding: 12px;
  margin: 8px 0;
  border-radius: 10px;
  border: 1px solid #ddd;
}

button {
  width: 100%;
  padding: 14px;
  margin-top: 10px;
  border-radius: 10px;
  border: none;
  font-weight: bold;
  font-size: 16px;
}

.btn-main {
  background: #ff7a00;
  color: white;
}

.btn-wsp {
  background: #25D366;
  color: white;
}

.result {
  display: none;
  margin-top: 20px;
  padding: 15px;
  border-radius: 12px;
  background: #fff7f0;
  animation: fadeIn 0.4s ease;
}

@keyframes fadeIn {
  from {opacity:0; transform:translateY(10px);}
  to {opacity:1;}
}

h2 {
  color: #ff7a00;
  margin: 5px 0;
}

.badge {
  background: #ff7a00;
  color: white;
  padding: 6px 10px;
  border-radius: 6px;
  display: inline-block;
  margin-top: 10px;
  font-size: 13px;
}

.progress {
  height: 8px;
  background: #eee;
  border-radius: 5px;
  margin-top: 10px;
}

.progress-bar {
  height: 100%;
  width: 0%;
  background: #ff7a00;
  border-radius: 5px;
  transition: width 0.6s ease;
}

.small {
  font-size: 14px;
  margin-top: 10px;
}
</style>
</head>

<body>

<div class="container">

<img src="logo.png" class="logo">

<div class="card">

<input type="number" id="peso" placeholder="Peso del perro (kg)">

<select id="actividad">
  <option value="2">Sedentario</option>
  <option value="2.5" selected>Normal</option>
  <option value="3">Activo</option>
</select>

<button class="btn-main" onclick="calcular()">Calcular</button>

<div class="progress">
  <div class="progress-bar" id="barra"></div>
</div>

<div class="result" id="box">

<h2 id="gramos"></h2>
<p id="cubos"></p>
<p id="bolsas"></p>

<h2 id="precio"></h2>
<p id="mensual"></p>

<div class="badge">🔥 Recomendado por BARFITOS</div>

<p class="small">
✔ Porción exacta sin desperdicio<br>
✔ Alimentación natural<br>
✔ Listo para servir
</p>

</div>

<a id="wsp" target="_blank" style="display:none;">
<button class="btn-wsp">Pedir ahora por WhatsApp</button>
</a>

</div>
</div>

<script>
function calcular() {

let peso = parseFloat(document.getElementById("peso").value);
let porcentaje = parseFloat(document.getElementById("actividad").value);

if (!peso || peso <= 0) {
  alert("Ingresá un peso válido");
  return;
}

let gramos = peso * (porcentaje / 100) * 1000;
let cubos = gramos / 20;
let cubosSemana = cubos * 7;
let bolsas = Math.ceil(cubosSemana / 150);

let precioBolsa = 26000; // CAMBIAR
let semanal = bolsas * precioBolsa;
let mensual = semanal * 4;

document.getElementById("box").style.display = "block";

document.getElementById("gramos").innerText =
  gramos.toFixed(0) + " g por día";

document.getElementById("cubos").innerText =
  cubos.toFixed(0) + " cubos diarios";

document.getElementById("bolsas").innerText =
  bolsas + " bolsas por semana";

document.getElementById("precio").innerText =
  "Total semanal: $" + semanal;

document.getElementById("mensual").innerText =
  "Aproximado mensual: $" + mensual;

document.getElementById("barra").style.width = "100%";

let mensaje = "Hola! Quiero BARFITOS 🐾\n" +
              "Peso: " + peso + "kg\n" +
              "Necesita: " + gramos.toFixed(0) + "g diarios\n" +
              "Equivale a: " + bolsas + " bolsas por semana\n" +
              "Total semanal: $" + semanal;

document.getElementById("wsp").href =
  "https://wa.me/5492284612612?text=" + encodeURIComponent(mensaje);

document.getElementById("wsp").style.display = "block";

}
</script>

</body>
</html>
