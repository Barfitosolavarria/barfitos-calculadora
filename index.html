<!DOCTYPE html>
<html lang="es">
<head>
<meta charset="UTF-8">
<title>Calculadora BARFITOS</title>

<style>
body {
  font-family: Arial;
  text-align: center;
  background: #f5f5f5;
}

.container {
  background: white;
  padding: 20px;
  margin: 40px auto;
  width: 90%;
  max-width: 400px;
  border-radius: 10px;
}

input, select, button {
  width: 100%;
  padding: 10px;
  margin: 10px 0;
}

button {
  background: black;
  color: white;
  border: none;
  border-radius: 5px;
}

.result {
  margin-top: 20px;
}
</style>
</head>

<body>

<div class="container">
<h2>Calculadora BARFITOS 🐾</h2>

<input type="number" id="peso" placeholder="Peso del perro (kg)">

<select id="actividad">
  <option value="2">Sedentario</option>
  <option value="2.5">Normal</option>
  <option value="3">Activo</option>
</select>

<button onclick="calcular()">Calcular</button>

<div class="result">
  <h3 id="gramos"></h3>
  <p id="cubos"></p>
  <p id="bolsas"></p>
  <h2 id="precio"></h2>
</div>

<a id="whatsapp" target="_blank">
  <button>Comprar por WhatsApp</button>
</a>

</div>

<script>
function calcular() {

  let peso = parseFloat(document.getElementById("peso").value);
  let porcentaje = parseFloat(document.getElementById("actividad").value);

  let gramos = peso * (porcentaje / 100) * 1000;

  let cubos = gramos / 20;
  let cubosSemana = cubos * 7;

  let bolsas = Math.ceil(cubosSemana / 150);

  let precioBolsa = 26000; // 🔥 CAMBIAR
  let total = bolsas * precioBolsa;

  document.getElementById("gramos").innerText =
    gramos.toFixed(0) + " g por día";

  document.getElementById("cubos").innerText =
    cubos.toFixed(0) + " cubos diarios";

  document.getElementById("bolsas").innerText =
    bolsas + " bolsas por semana";

  document.getElementById("precio").innerText =
    "Total: $" + total;

  let mensaje = "Hola! Quiero pedir BARFITOS.\n" +
                "Peso: " + peso + "kg\n" +
                "Necesito: " + bolsas + " bolsas por semana";

  document.getElementById("whatsapp").href =
    "https://wa.me/5492284612612?text=" + encodeURIComponent(mensaje);
}
</script>

</body>
</html>
