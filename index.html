<!DOCTYPE html><html>
<head>
<meta name="viewport" content="width=device-width, initial-scale=1">
<style>
body{font-family:Arial;background:#f2f2f2;margin:0}
.box{max-width:400px;margin:auto;background:#fff;padding:20px;border-radius:15px;margin-top:20px}
input,select,button{width:100%;margin-top:10px;padding:12px;border-radius:10px;border:1px solid #ddd}
button{background:#ff7a00;color:#fff;border:none;font-weight:bold}
.btn-wsp{background:#25D366}
h2{text-align:center}
#res{margin-top:15px;text-align:center}
</style>
</head>
<body><div class="box"><h2>Calculadora BARFITOS</h2><select id="animal">
<option value="perro">Perro</option>
<option value="gato">Gato</option>
</select><select id="etapa">
<option value="adulto">Adulto</option>
<option value="cachorro">Cachorro</option>
</select><input id="peso" type="number" placeholder="Peso en kg"><select id="actividad">
<option value="2">Sedentario</option>
<option value="2.5">Normal</option>
<option value="3">Activo</option>
</select><button onclick="calc()">Calcular</button>

<div id="res"></div><button id="wsp" class="btn-wsp" style="display:none" onclick="irWsp()">
Contactar por WhatsApp
</button></div><script>
var mensaje="";

function calc(){

var peso=parseFloat(document.getElementById("peso").value);
var animal=document.getElementById("animal").value;
var etapa=document.getElementById("etapa").value;
var act=parseFloat(document.getElementById("actividad").value);

if(!peso||peso<=0){
alert("Ingresá un peso válido");
return;
}

var porc;

if(animal=="perro"){
porc=(etapa=="cachorro")?5:act;
}else{
porc=(etapa=="cachorro")?6:3;
}

var gramos=peso*(porc/100)*1000;
var cubos=(gramos/20)*30;
var bolsas=Math.ceil(cubos/150);

var total=bolsas*26000;
var descuento=Math.round(total*0.85);

// resultado base
var resultado=
"<h3>"+bolsas+" bolsas por mes</h3>"+
"<p>Total: $"+total+"</p>";

// plan mensual solo desde 4 bolsas
if(bolsas>=4){
resultado += "<p><b>Plan mensual 15% OFF: $"+descuento+"</b></p>";
}else{
resultado += "<p style='color:#777'>Plan mensual disponible desde 4 bolsas</p>";
}

document.getElementById("res").innerHTML=resultado;

// mensaje WhatsApp
mensaje =
"Hola! Quiero asesoramiento BARFITOS 🐾%0A"+
"Animal: "+animal+"%0A"+
"Etapa: "+etapa+"%0A"+
"Bolsas por mes: "+bolsas+"%0A"+
"Total: $"+total;

// mostrar botón
document.getElementById("wsp").style.display="block";
}

function irWsp(){
window.open("https://wa.me/5492284612612?text="+mensaje);
}
</script></body>
</html>
